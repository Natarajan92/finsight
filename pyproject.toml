[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finsight"
version = "0.1.0"
description = "A learning-first financial filing RAG project"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pypdf>=6.21.1,<7",
]

[dependency-groups]
dev = ["pytest", "ruff", "jupyterlab", "ipykernel", "nbclient", "nbformat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --basetemp=.artifacts/pytest"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
